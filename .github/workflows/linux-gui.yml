# Re-run the Linux GUI harness against an already built Linux app artifact (no
# rebuild): the newest successful linux-zen-build run (or the run given), then
# `./dev gui-test` via linux-zen-reusable.yml. Results go to ci-results.
#
# Triggers: push to cloud/linux-platform touching the harness; a pull request
# against cloud/integration carrying the `linux-gui` label; manual dispatch once
# this file is on the default branch.
name: Linux GUI test

on:
  push:
    branches: [cloud/integration, dev]
    paths:
      - .github/workflows/linux-gui.yml
      - scripts/gui_test.py
      - scripts/gui_engines/**
      - scripts/linux_build.py
      - scripts/fixtures.py
  workflow_dispatch:
    inputs:
      run_id:
        description: linux-zen-build run id (default newest successful)
        required: false
      engine:
        description: Engine plug-in (scripts/gui_engines)
        default: gecko
  pull_request:
    types: [labeled, synchronize]
    branches: [cloud/integration, dev]

permissions:
  contents: read

concurrency:
  group: linux-gui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'linux-gui')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.pick.outputs.run_id }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            # Newest run (any branch) whose build job uploaded the app artifact.
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/linux-zen-build.yml/runs?per_page=30" \
                          --jq '.workflow_runs[] | select(.status=="completed") | .id'); do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                   --jq '.artifacts[] | select(.name=="axiosozo-zen-linux-x86_64" and (.expired|not)) | .id' | grep -q .; then
                RUN_ID=$id; break
              fi
            done
          fi
          if [ -z "$RUN_ID" ]; then echo "::error::no linux-zen-build run with an app artifact"; exit 1; fi
          echo "run_id=$RUN_ID" | tee -a "$GITHUB_OUTPUT"

  gui:
    needs: resolve
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/linux-zen-reusable.yml
    with:
      prebuilt_run_id: ${{ needs.resolve.outputs.run_id }}
      engine: ${{ inputs.engine || 'gecko' }}
      results_name: gui
