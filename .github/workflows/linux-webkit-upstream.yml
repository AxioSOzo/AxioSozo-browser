# Evaluation of a current upstream WPE WebKit release (ADR 004): discover the
# official checksum, then (once pinned in upstreams.lock.json webkit.upstream)
# build it in the pinned debian:13 image with a cached ccache and run the host
# test suite against it. Not a product build; evidence only.
name: linux-webkit-upstream
on:
  push:
    branches: [cloud/webkit-host]
    paths:
      - native/webkit-host/upstream/**
      - .github/workflows/linux-webkit-upstream.yml

env:
  IMAGE: docker.io/library/debian:trixie-20261005@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EVIDENCE_OUT: ${{ github.workspace }}/../evidence-discover
    steps:
      - uses: actions/checkout@v4
      - run: sh native/webkit-host/upstream/discover.sh "$EVIDENCE_OUT"
      - if: always()
        uses: ./.github/actions/publish-ci-results
        with:
          path: ${{ env.EVIDENCE_OUT }}

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # 2.52.6 (upstream.previous_stable) built in 2.1-4.4 h cold vs 1.3-2.1 h for 2.54.1
        # (runs 39296934153, 39319667952); only the recommended release is rebuilt now.
        key: [upstream]
    env:
      EVIDENCE_OUT: ${{ github.workspace }}/../evidence-build
      CCACHE_HOST: ${{ github.workspace }}/../ccache
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_HOST }}
          key: wpe-ccache-${{ matrix.key }}-${{ hashFiles('upstreams.lock.json', 'native/webkit-host/upstream/build.sh') }}-${{ github.run_id }}
          restore-keys: |
            wpe-ccache-${{ matrix.key }}-${{ hashFiles('upstreams.lock.json', 'native/webkit-host/upstream/build.sh') }}-
            wpe-ccache-${{ matrix.key }}-
      - name: CI environment - allow unprivileged user namespaces (bubblewrap)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build upstream WPE and run the host suites
        timeout-minutes: 330
        run: |
          mkdir -p "$EVIDENCE_OUT" "$CCACHE_HOST"
          start=$(date +%s); set +e
          docker run --rm --shm-size=1g \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined \
            -v "$PWD:/src:ro" -v "$EVIDENCE_OUT:/out" -v "$CCACHE_HOST:/ccache" "$IMAGE" sh /src/native/webkit-host/upstream/build.sh "${{ matrix.key }}"
          code=$?
          echo "{\"key\": \"${{ matrix.key }}\", \"container_exit\": $code, \"wall_seconds\": $(( $(date +%s) - start ))}" > "$EVIDENCE_OUT/job.json"
          sudo chown -R "$(id -u)" "$CCACHE_HOST"
          exit $code
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_HOST }}
          key: wpe-ccache-${{ matrix.key }}-${{ hashFiles('upstreams.lock.json', 'native/webkit-host/upstream/build.sh') }}-${{ github.run_id }}
      - if: always()
        uses: ./.github/actions/publish-ci-results
        with:
          path: ${{ env.EVIDENCE_OUT }}
          name: build-${{ matrix.key }}
