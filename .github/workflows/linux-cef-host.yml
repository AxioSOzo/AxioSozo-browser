# CEF/Chromium engine host on Linux (cloud evidence for native/chromium-host).
# Builds the portable core + Linux layer against the pinned CEF minimal distribution,
# installs Chromium's SUID sandbox helper (the runner's AppArmor policy blocks
# unprivileged user namespaces), and runs E0, the authenticated stream, input, web and
# negative tests under Xvfb. A second job compile-checks the unchanged macOS host and
# the portable core against the pinned macOS headers. No secrets, read-only token.
name: linux-cef-host
on:
  push:
    branches: [cloud/linux-cef]
    paths:
      - native/chromium-host/**
      - upstreams.lock.json
      - tests/fixtures/engine.html
      - .github/workflows/linux-cef-host.yml
      - .github/actions/publish-ci-results/**
      - apps/browser/chrome/CEF*.sys.mjs
      - apps/browser/tests/cef-adapter.test.mjs
permissions:
  contents: read
concurrency:
  group: linux-cef-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: write          # publish-ci-results pushes to the ci-results branch only
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AXIOSOZO_BUILD_ROOT: ${{ github.workspace }}/.local/build
      EVIDENCE_OUT: ${{ github.workspace }}/.local/ci-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Machine resources
        run: |
          mkdir -p "$EVIDENCE_OUT"
          { echo "## uname -a"; uname -a; echo "## nproc"; nproc; echo "## free -h"; free -h;
            echo "## df -h"; df -h "$GITHUB_WORKSPACE" /tmp; echo "## os-release"; head -4 /etc/os-release;
            echo "## kernel sandbox knobs";
            for f in /proc/sys/kernel/apparmor_restrict_unprivileged_userns /proc/sys/kernel/unprivileged_userns_clone /proc/sys/user/max_user_namespaces; do
              echo "$f=$(cat $f 2>/dev/null || echo absent)"; done;
            echo "## DRM devices"; ls -la /dev/dri 2>&1 || true; ls /sys/class/drm 2>&1 || true;
            for d in /sys/class/drm/card*/device/driver; do echo "$d -> $(readlink -f $d 2>/dev/null)"; done; } | tee "$EVIDENCE_OUT/machine.txt"
      - name: Install apt packages (README "Linux")
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb xauth cmake ninja-build g++ zlib1g-dev bzip2 curl \
            openssl util-linux libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 libcups2t64 \
            libdrm2 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxext6 libx11-6 \
            libx11-xcb1 libxcb1 libxshmfence1 libpango-1.0-0 libcairo2 libasound2t64 libglib2.0-0t64 libdbus-1-3 \
            libexpat1 fonts-dejavu-core fonts-liberation
          { g++ --version | head -1; cmake --version | head -1; ninja --version; python3 --version; } | tee "$EVIDENCE_OUT/toolchain.txt"
      # restore/save are split so the verified archive is cached even when a later
      # step (compile, tests) fails; probe.py re-verifies the sha256 of a cache hit.
      - name: Restore pinned CEF archive (sha256-verified by probe.py)
        id: cef-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.local/build/cef/*.tar.bz2
          key: cef-154.0.23-g062ebe4-${{ runner.arch }}-minimal
      - name: probe.py setup (download, verify, CMake build)
        run: |
          set -o pipefail
          /usr/bin/time -v python3 native/chromium-host/probe.py setup 2>&1 | tee "$EVIDENCE_OUT/setup.log"
          ldd .local/build/cef/linux*/AxioCEFProbe | tee "$EVIDENCE_OUT/ldd-host.txt"
          ldd .local/build/cef/linux*/libcef.so | grep "not found" | tee "$EVIDENCE_OUT/ldd-libcef-missing.txt" || true
      - name: Save pinned CEF archive
        if: always() && steps.cef-cache.outputs.cache-hit != 'true' && hashFiles('.local/build/cef/*.tar.bz2') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.local/build/cef/*.tar.bz2
          key: cef-154.0.23-g062ebe4-${{ runner.arch }}-minimal
      - name: probe.py install-sandbox (chrome-sandbox root:root 4755)
        run: python3 native/chromium-host/probe.py install-sandbox 2>&1 | tee "$EVIDENCE_OUT/install-sandbox.log"
      - name: probe.py check
        run: python3 native/chromium-host/probe.py check 2>&1 | tee "$EVIDENCE_OUT/check.log"
      - name: probe.py test-native and test_probe.py
        continue-on-error: true
        run: |
          set -o pipefail
          python3 native/chromium-host/probe.py test-native 2>&1 | tee "$EVIDENCE_OUT/test-native.log"
          python3 native/chromium-host/test_probe.py -v 2>&1 | tee "$EVIDENCE_OUT/test-probe.log"
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > "$EVIDENCE_OUT/xvfb.log" 2>&1 &
          for i in $(seq 1 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: E0 (probe.py run)
        continue-on-error: true
        run: |
          set -o pipefail
          # Diagnostics only: kernel stacks of any host process in uninterruptible sleep.
          # Run 39297085450: on a fresh runner the browser and GPU processes wait ~2-4 s on
          # first-run file reads outside the CEF runtime, which delays the first paint.
          ( for i in $(seq 1 30); do sleep 0.5
              for p in $(ps -eo pid=,stat=,args= | awk '$2 ~ /^D/ && $3 ~ /AxioCEFProbe/ {print $1}'); do
                echo "== pid $p $(date +%T.%N) $(ps -o args= -p $p | cut -c1-160)"; sudo cat /proc/$p/stack 2>&1; done
            done ) > "$EVIDENCE_OUT/e0-d-state-stacks.txt" 2>&1 &
          timeout 300 python3 native/chromium-host/probe.py run 2>&1 | tee "$EVIDENCE_OUT/e0.log"
      - name: Authenticated stream (stream_test.py)
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 600 python3 native/chromium-host/stream_test.py 2>&1 | tee "$EVIDENCE_OUT/stream.log"
      - name: Negative tests (stream_security_test.py)
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 600 python3 native/chromium-host/stream_security_test.py 2>&1 | tee "$EVIDENCE_OUT/security.log"
      - name: Input fidelity (input_test.py)
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 600 python3 native/chromium-host/input_test.py 2>&1 | tee "$EVIDENCE_OUT/input.log"
      - name: Web mode (web_stream_test.py)
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 600 python3 native/chromium-host/web_stream_test.py 2>&1 | tee "$EVIDENCE_OUT/web.log"
      - name: Frame damage (damage_test.py)
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 300 python3 native/chromium-host/damage_test.py 2>&1 | tee "$EVIDENCE_OUT/damage.log"
      - name: Zen-side adapter/presenter node tests
        continue-on-error: true
        run: |
          set -o pipefail
          node --version | tee "$EVIDENCE_OUT/node-tests.log"
          node --test apps/browser/tests/cef-adapter.test.mjs apps/browser/tests/chromium-tabs.test.mjs \
            apps/browser/tests/chromium-browser-ui.test.mjs apps/browser/tests/engine-surface.test.mjs 2>&1 \
            | tail -n 30 | tee -a "$EVIDENCE_OUT/node-tests.log"
      - name: macOS-only surface test reports its skip
        continue-on-error: true
        run: python3 native/chromium-host/surface_test.py 2>&1 | tee "$EVIDENCE_OUT/surface.log"
      - name: No host process left behind
        if: always()
        run: |
          ps -eo pid,ppid,pgid,stat,etime,args | grep -E "AxioCEFProbe|chrome-sandbox" | grep -v grep | tee "$EVIDENCE_OUT/leftover-processes.txt" || true
      - name: Verdict (every gate's last JSON line must say PASS)
        id: verdict
        if: always()
        run: |
          python3 - "$EVIDENCE_OUT" <<'PY'
          import json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          def last_status(name):
              path = out / name
              if not path.exists():
                  return 'MISSING'
              for line in reversed(path.read_text(errors='replace').splitlines()):
                  try:
                      value = json.loads(line)
                  except ValueError:
                      continue
                  if isinstance(value, dict) and 'status' in value:
                      return value['status']
              return 'NO_RESULT'
          gates = {name: last_status(name + '.log') for name in ('check', 'test-native', 'e0', 'stream', 'security', 'input', 'web', 'damage')}
          node = (out / 'node-tests.log').read_text(errors='replace') if (out / 'node-tests.log').exists() else ''
          gates['node-tests'] = 'PASS' if '# fail 0' in node else 'FAIL'
          probe_tests = (out / 'test-probe.log').read_text(errors='replace') if (out / 'test-probe.log').exists() else ''
          gates['test-probe'] = 'PASS' if any(line.startswith('OK') for line in probe_tests.splitlines()) else 'FAIL'
          verdict = 'PASS' if all(value == 'PASS' for value in gates.values()) else 'FAIL'
          (out / 'verdict.json').write_text(json.dumps(dict(verdict=verdict, gates=gates), indent=2) + '\n')
          print(json.dumps(dict(verdict=verdict, gates=gates)))
          PY
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p "$EVIDENCE_OUT/docs-evidence"
          cp -a docs/evidence/. "$EVIDENCE_OUT/docs-evidence/" 2>/dev/null || true
          find "$EVIDENCE_OUT" -name '*.png' -size +3M -delete
      - name: Publish evidence to the ci-results branch
        if: always()
        uses: ./.github/actions/publish-ci-results
        with:
          path: ${{ env.EVIDENCE_OUT }}
          name: linux-${{ matrix.runner }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: linux-cef-evidence-${{ matrix.runner }}
          path: ${{ github.workspace }}/.local/ci-evidence
          retention-days: 14
      - name: Fail the job unless every gate passed
        if: always()
        run: python3 -c "import json,sys; v=json.load(open('$EVIDENCE_OUT/verdict.json')); print(v); sys.exit(v['verdict']!='PASS')"

  macos-compile:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Pinned macOS CEF headers (sha256 verified)
        run: |
          set -euo pipefail
          url=$(python3 -c "import json;print(json.load(open('upstreams.lock.json'))['cef']['url'])")
          sha=$(python3 -c "import json;print(json.load(open('upstreams.lock.json'))['cef']['sha256'])")
          curl --fail --location --max-time 900 -o "$RUNNER_TEMP/cef-mac.tar.bz2" "$url"
          echo "$sha  $RUNNER_TEMP/cef-mac.tar.bz2" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/cef"
          tar -xjf "$RUNNER_TEMP/cef-mac.tar.bz2" -C "$RUNNER_TEMP/cef" --strip-components 1 '*/include' '*/libcef_dll/wrapper/cef_scoped_sandbox_context_mac.mm'
      - name: Compile-check the unchanged macOS host and the portable core
        run: |
          set -euo pipefail
          CEF="$RUNNER_TEMP/cef"
          common=(-std=c++20 -fobjc-arc -arch arm64 -mmacosx-version-min=14.5 -DCEF_USE_SANDBOX=1 -DCEF_API_VERSION=15400 -I "$CEF" -fsyntax-only)
          xcrun clang++ "${common[@]}" native/chromium-host/host.mm
          xcrun clang++ "${common[@]}" -DAXIO_CEF_HELPER=1 native/chromium-host/host.mm
          xcrun clang++ "${common[@]}" native/chromium-host/surface_transport.mm
          xcrun clang++ -std=c++20 -fno-exceptions -fno-rtti -Wall -Wextra -Wno-unused-parameter -Wno-missing-field-initializers \
            -DCEF_API_VERSION=15400 -I "$CEF" -fsyntax-only native/chromium-host/core/host_core.cc
          xcrun clang++ -std=c++20 -Wall -Wextra -I native/chromium-host native/chromium-host/tests/core_test.cc -o "$RUNNER_TEMP/core-test"
          "$RUNNER_TEMP/core-test"
          echo "macOS host.mm (browser + helper), surface_transport.mm and the portable core compile against the pinned headers"
