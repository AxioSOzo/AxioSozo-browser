# Engine performance benchmarks on Linux (tools/engine-bench, docs/PERFORMANCE.md).
#
#   webkit     WPE WebKit host (native/webkit-host of this checkout) in the pinned debian:13 image,
#              5 repetitions without damage (what Zen negotiates today) + 1 MiB-pipe A/B,
#              5 repetitions with hello.frame_damage.
#   chromium   Linux CEF host from cloud/linux-cef at a pinned commit (that branch's own lockfile
#              pins and sha256-checks the CEF distribution), same bench under Xvfb.
#   presenter  Zen presenter pixel path: the real bgraToRGBA in Node, and bgraToRGBA + putImageData
#              (+ candidate fixes) in the Firefox/Chrome preinstalled on the runner image.
#   summary    one markdown + JSON across all jobs.
#
# Every job publishes small results (JSON, logs, a few 1x PNGs) to the ci-results branch.
# Runners have no GPU: all engines render in software (see docs/PERFORMANCE.md "Bias").
# CI environment settings for the WebKit sandbox are the same as linux-webkit-host.yml
# (runner userns sysctl, container seccomp/apparmor/systempaths unconfined); the sandbox
# itself is never disabled. Chromium uses its SUID sandbox helper, as in linux-cef-host.yml.
name: linux-engine-bench
on:
  push:
    branches: [claude/engine-bench-t1o9jm, cloud/engine-bench]
    paths:
      - tools/engine-bench/**
      - .github/workflows/linux-engine-bench.yml
      - .github/actions/publish-ci-results/**

permissions:
  contents: read

concurrency:
  group: linux-engine-bench-${{ github.ref }}
  cancel-in-progress: false

env:
  # upstreams.lock.json webkit.ci_image
  WEBKIT_IMAGE: docker.io/library/debian:trixie-20261005@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5
  # cloud/linux-cef head of green linux-cef-host run 39298920882
  CEF_REF: ae99a098d550e8c0fdfac77d3c8d986cc1f3c125
  BENCH_REPS: "5"

jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      EVIDENCE_OUT: ${{ github.workspace }}/../evidence-webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner resources
        run: |
          mkdir -p "$EVIDENCE_OUT"
          { uname -a; nproc; lscpu | head -20; free -m; ls -la /dev/dri 2>&1 || true; } > "$EVIDENCE_OUT/runner.txt"
      - name: CI environment - allow unprivileged user namespaces (bubblewrap)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Bench the WPE host in debian:13 (pinned)
        run: |
          docker pull -q "$WEBKIT_IMAGE"
          start=$(date +%s); set +e
          docker run --rm --shm-size=1g -e BENCH_REPS \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined \
            -v "$PWD:/src:ro" -v "$EVIDENCE_OUT:/out" "$WEBKIT_IMAGE" sh /src/tools/engine-bench/ci/webkit_container.sh
          code=$?
          echo "{\"container_exit\": $code, \"wall_seconds\": $(( $(date +%s) - start ))}" > "$EVIDENCE_OUT/job.json"
          tail -n 30 "$EVIDENCE_OUT/bench.log" "$EVIDENCE_OUT/bench-damage.log" 2>/dev/null
          exit $code
      - name: Summary
        if: always()
        run: python3 tools/engine-bench/summarize.py "$EVIDENCE_OUT/bench" --out "$EVIDENCE_OUT/summary.md" --run-id "${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: ./.github/actions/publish-ci-results
        with:
          path: ${{ env.EVIDENCE_OUT }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-webkit
          path: ${{ env.EVIDENCE_OUT }}/bench/*.json
          retention-days: 30

  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AXIOSOZO_BUILD_ROOT: ${{ github.workspace }}/cef-src/.local/build
      EVIDENCE_OUT: ${{ github.workspace }}/../evidence-chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux CEF host sources (cloud/linux-cef, pinned commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CEF_REF }}
          path: cef-src
          persist-credentials: false
      - name: Runner resources
        run: |
          mkdir -p "$EVIDENCE_OUT"
          { uname -a; nproc; lscpu | head -20; free -m; ls -la /dev/dri 2>&1 || true; git -C cef-src rev-parse HEAD; } > "$EVIDENCE_OUT/runner.txt"
      - name: Install apt packages (native/chromium-host README "Linux", as linux-cef-host.yml)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb xauth cmake ninja-build g++ zlib1g-dev bzip2 curl \
            openssl util-linux libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 libcups2t64 \
            libdrm2 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxext6 libx11-6 \
            libx11-xcb1 libxcb1 libxshmfence1 libpango-1.0-0 libcairo2 libasound2t64 libglib2.0-0t64 libdbus-1-3 \
            libexpat1 fonts-dejavu-core fonts-liberation
      - name: Restore pinned CEF archive (sha256-verified by probe.py)
        id: cef-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/cef-src/.local/build/cef/*.tar.bz2
          key: cef-154.0.23-g062ebe4-${{ runner.arch }}-minimal
      - name: probe.py setup (download, verify, CMake build)
        run: |
          set -o pipefail
          python3 cef-src/native/chromium-host/probe.py setup 2>&1 | tee "$EVIDENCE_OUT/setup.log"
      - name: Save pinned CEF archive
        if: always() && steps.cef-cache.outputs.cache-hit != 'true' && hashFiles('cef-src/.local/build/cef/*.tar.bz2') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/cef-src/.local/build/cef/*.tar.bz2
          key: cef-154.0.23-g062ebe4-${{ runner.arch }}-minimal
      - name: probe.py install-sandbox and check
        run: |
          set -o pipefail
          python3 cef-src/native/chromium-host/probe.py install-sandbox 2>&1 | tee "$EVIDENCE_OUT/install-sandbox.log"
          python3 cef-src/native/chromium-host/probe.py check 2>&1 | tee "$EVIDENCE_OUT/check.log"
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > "$EVIDENCE_OUT/xvfb.log" 2>&1 &
          for i in $(seq 1 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Bench (no damage + 1 MiB pipe A/B)
        run: |
          set -o pipefail
          timeout 3000 python3 tools/engine-bench/bench.py --engine chromium --cef-root cef-src --out "$EVIDENCE_OUT/bench" \
            --reps "$BENCH_REPS" --pipe-experiment 2>&1 | tee "$EVIDENCE_OUT/bench.log"
      - name: Bench (hello.frame_damage)
        if: always()
        run: |
          set -o pipefail
          timeout 3000 python3 tools/engine-bench/bench.py --engine chromium --cef-root cef-src --out "$EVIDENCE_OUT/bench" \
            --reps "$BENCH_REPS" --frame-damage 2>&1 | tee "$EVIDENCE_OUT/bench-damage.log"
      - name: Summary
        if: always()
        run: |
          ps -eo pid,ppid,args | grep -E "AxioCEFProbe|chrome-sandbox" | grep -v grep > "$EVIDENCE_OUT/leftover-processes.txt" || true
          python3 tools/engine-bench/summarize.py "$EVIDENCE_OUT/bench" --out "$EVIDENCE_OUT/summary.md" --run-id "${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: ./.github/actions/publish-ci-results
        with:
          path: ${{ env.EVIDENCE_OUT }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-chromium
          path: ${{ env.EVIDENCE_OUT }}/bench/*.json
          retention-days: 30

  presenter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      EVIDENCE_OUT: ${{ github.workspace }}/../evidence-presenter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner resources and preinstalled browsers (runner image; nothing downloaded)
        run: |
          mkdir -p "$EVIDENCE_OUT"
          { uname -a; nproc; lscpu | head -20; free -m; node --version; command -v firefox; firefox --version;
            command -v google-chrome; google-chrome --version; } > "$EVIDENCE_OUT/runner.txt" 2>&1 || true
      - name: Node (V8) - real bgraToRGBA and candidates
        run: node tools/engine-bench/presenter/node_bench.mjs "$EVIDENCE_OUT/presenter-node.json" > "$EVIDENCE_OUT/node.log"
      - name: Firefox (Gecko) - bgraToRGBA + putImageData and candidates
        if: always()
        run: python3 tools/engine-bench/presenter/run_browser.py --browser firefox --binary "$(command -v firefox)" --out "$EVIDENCE_OUT/presenter-firefox.json"
      - name: Chrome (Blink) - same page, for comparison
        if: always()
        run: python3 tools/engine-bench/presenter/run_browser.py --browser chromium --binary "$(command -v google-chrome)" --out "$EVIDENCE_OUT/presenter-chrome.json"
      - name: Summary
        if: always()
        run: python3 tools/engine-bench/summarize.py "$EVIDENCE_OUT" --out "$EVIDENCE_OUT/summary.md" --run-id "${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: ./.github/actions/publish-ci-results
        with:
          path: ${{ env.EVIDENCE_OUT }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-presenter
          path: ${{ env.EVIDENCE_OUT }}/presenter-*.json
          retention-days: 30

  summary:
    if: always()
    needs: [webkit, chromium, presenter]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EVIDENCE_OUT: ${{ github.workspace }}/../evidence-summary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-*
          path: ${{ github.workspace }}/../bench-artifacts
      - name: Combined summary
        run: |
          mkdir -p "$EVIDENCE_OUT"
          python3 tools/engine-bench/summarize.py "${{ github.workspace }}/../bench-artifacts" --out "$EVIDENCE_OUT/summary.md" \
            --json "$EVIDENCE_OUT/summary.json" --run-id "${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo '{"webkit":"${{ needs.webkit.result }}","chromium":"${{ needs.chromium.result }}","presenter":"${{ needs.presenter.result }}"}' > "$EVIDENCE_OUT/jobs.json"
      - if: always()
        uses: ./.github/actions/publish-ci-results
        with:
          path: ${{ env.EVIDENCE_OUT }}
