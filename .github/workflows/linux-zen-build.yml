# Full Linux build of the AxioSozo Zen app (scripts/zen.py setup) with sccache,
# packaged as a workflow ARTIFACT (never a release) that later work downloads with
# `./dev fetch-build`. Then the packaged app is launched under Xvfb by the GUI
# harness and its screenshots/results are uploaded.
#
# Triggers: manual dispatch (once this file is on the default branch), or adding
# the `linux-build` label to a pull request against cloud/integration (remove
# and re-add the label to build again).
name: Linux Zen build

on:
  workflow_dispatch:
    inputs:
      sccache:
        description: Use the sccache compiler cache
        type: boolean
        default: true
  pull_request:
    types: [labeled]
    branches: [cloud/integration]

permissions:
  contents: read

concurrency:
  group: linux-zen-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'linux-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    defaults:
      run:
        shell: bash
    env:
      AXIOSOZO_SCCACHE: ${{ (github.event_name != 'workflow_dispatch' || inputs.sccache) && '1' || '0' }}
      AXIOSOZO_SCCACHE_SIZE: 6G
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner resources (before cleanup)
        run: |
          uname -a
          nproc
          free -h
          df -h

      - name: Free disk space (preinstalled SDKs this build does not use)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h

      - name: Choose the build root (largest free disk, outside the checkout)
        run: |
          root_free=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          mnt_free=$(df --output=avail -BG /mnt 2>/dev/null | tail -1 | tr -dc 0-9 || echo 0)
          if [ "${mnt_free:-0}" -gt "$root_free" ]; then
            sudo mkdir -p /mnt/axiosozo-build && sudo chown "$(id -u):$(id -g)" /mnt/axiosozo-build
            echo "AXIOSOZO_BUILD_ROOT=/mnt/axiosozo-build" >> "$GITHUB_ENV"
          else
            mkdir -p /home/runner/axiosozo-build
            echo "AXIOSOZO_BUILD_ROOT=/home/runner/axiosozo-build" >> "$GITHUB_ENV"
          fi
          echo "root ${root_free}G free, /mnt ${mnt_free:-0}G free"

      - name: System packages (scripts/linux_packages.py build)
        run: |
          start=$(date +%s)
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $(python3 scripts/linux_packages.py build)
          echo "apt seconds: $(( $(date +%s) - start ))"
          clang --version | head -1
          ld.lld --version

      - name: Restore pinned toolchain downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AXIOSOZO_BUILD_ROOT }}/toolchains/zen/downloads
          key: zen-toolchain-downloads-${{ runner.arch }}-${{ hashFiles('patches/zen/toolchains-linux-*.json') }}

      - name: Restore sccache
        if: env.AXIOSOZO_SCCACHE == '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AXIOSOZO_BUILD_ROOT }}/caches/sccache
          key: zen-sccache-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: zen-sccache-${{ runner.arch }}-

      - name: Pinned upstream sources (Zen, t3code)
        run: ./dev setup --only upstreams

      - name: Zen build (toolchain, source import, mach build)
        timeout-minutes: 300
        run: |
          start=$(date +%s)
          /usr/bin/time -v ./dev setup --only zen 2>&1 | tee zen-setup.log
          echo "ZEN_BUILD_SECONDS=$(( $(date +%s) - start ))" | tee -a "$GITHUB_ENV"

      - name: Build statistics
        if: always()
        run: |
          echo "zen setup seconds: ${ZEN_BUILD_SECONDS:-unfinished}"
          grep -E "Elapsed \(wall clock\)|Maximum resident set size|Total build time|Overall system resources" zen-setup.log || true
          if [ -x "$AXIOSOZO_BUILD_ROOT/toolchains/zen/sccache/sccache" ]; then
            SCCACHE_DIR="$AXIOSOZO_BUILD_ROOT/caches/sccache" "$AXIOSOZO_BUILD_ROOT/toolchains/zen/sccache/sccache" --show-stats || true
            SCCACHE_DIR="$AXIOSOZO_BUILD_ROOT/caches/sccache" "$AXIOSOZO_BUILD_ROOT/toolchains/zen/sccache/sccache" --stop-server || true
          fi
          du -sh "$AXIOSOZO_BUILD_ROOT"/* 2>/dev/null || true
          df -h

      - name: Save sccache
        if: always() && env.AXIOSOZO_SCCACHE == '1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AXIOSOZO_BUILD_ROOT }}/caches/sccache
          key: zen-sccache-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save pinned toolchain downloads
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AXIOSOZO_BUILD_ROOT }}/toolchains/zen/downloads
          key: zen-toolchain-downloads-${{ runner.arch }}-${{ hashFiles('patches/zen/toolchains-linux-*.json') }}
        continue-on-error: true

      - name: Package (mach package + axiosozo-build-info.json)
        run: |
          ./dev package 2>&1 | tee package.log
          ls -la "$AXIOSOZO_BUILD_ROOT/zen/obj/dist/" | grep -E "axiosozo" || true

      - name: Upload the Linux build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axiosozo-zen-linux-x86_64
          path: |
            ${{ env.AXIOSOZO_BUILD_ROOT }}/zen/obj/dist/axiosozo-dev-*.tar.xz
            ${{ env.AXIOSOZO_BUILD_ROOT }}/zen/obj/dist/axiosozo-build-info.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axiosozo-zen-linux-build-logs
          path: |
            zen-setup.log
            package.log
            ${{ env.AXIOSOZO_BUILD_ROOT }}/zen/obj/config.log
            ${{ env.AXIOSOZO_BUILD_ROOT }}/zen/source/engine/mozconfig
          if-no-files-found: ignore
          retention-days: 14

  gui:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      AXIOSOZO_BUILD_ROOT: /home/runner/axiosozo-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner resources
        run: |
          uname -a; nproc; free -h; df -h /

      - name: GUI packages (scripts/linux_packages.py gui)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $(python3 scripts/linux_packages.py gui)

      - name: Download the build artifact of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axiosozo-zen-linux-x86_64
          path: artifact

      - name: Verify and unpack (same path as ./dev fetch-build)
        run: ./dev fetch-build --from-dir artifact --run "${{ github.run_id }}"

      - name: GUI harness (Xvfb, owned profile, Gecko fixture, xdotool input)
        run: ./dev gui-test --app fetched --engine gecko --scenario all --screenshot gui/linux-gecko-fixture.png --evidence-dir gui/evidence

      - name: Upload GUI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axiosozo-gui-linux-x86_64
          path: gui/
          if-no-files-found: ignore
          retention-days: 30
