# MPL-2.0. Browser-chrome feature flag; Zen keeps its upstream defaults.
- name: axiosozo.foundation.enabled
  value: true
# A development-only bundle must not prompt to replace the user's default browser.
# The user can still invoke the normal manual default-browser controls.
- name: browser.shell.checkDefaultBrowser
  value: false
# Handoff 3 (contracts/contexts-api-v1.md section 4). F1-F5: contexts, projects,
# the Overview page and site rules. F6 stays off until E1/E2 pass.
- name: axiosozo.contexts.enabled
  value: true
- name: axiosozo.engine.preferences.enabled
  value: false
# Open decision 4 (decided: ships): Jev key entry is on; set false as a kill switch.
- name: axiosozo.jev.keyEntry.enabled
  value: true
# Plan 4 step 5 (decided): OpenAI key entry is on too, gated by its own pref.
# Storing a key never turns on consent or calls OpenAI; removal is always allowed.
- name: axiosozo.openai.keyEntry.enabled
  value: true
# Zen sidebar: bottom space switcher instead of the space icons, space header,
# foot "+" and Library button. false returns to stock Zen (live).
- name: axiosozo.ui.spaceSwitcher.enabled
  value: true
# Plan 4 P3 (contracts/agent-channel-v1.md section 1): the local agent status
# endpoint is off in every new browser process. Only the explicit "Turn on"
# in AxioSozo settings of a normal window starts it, for that session. A saved
# true is cleared and never starts anything.
- name: axiosozo.agent.endpoint.enabled
  value: false
